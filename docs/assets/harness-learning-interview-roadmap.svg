<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">从读懂 Agent Harness 到能够面试</title><desc id="desc">通过读懂、修改、验证和表达四个阶段，把源码理解转化为可展示的面试证据。</desc>
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#B66932"/></marker><style>.s{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}.e{font-size:21px;font-weight:700;letter-spacing:4px;fill:#9A6A39}.t{font-size:45px;font-weight:800;fill:#243236}.st{font-size:23px;fill:#667174}.n{font-size:22px;font-weight:800}.h{font-size:31px;font-weight:800}.b{font-size:20px}.tag{font-size:18px;font-weight:700}</style></defs>
  <rect width="1600" height="900" fill="#F2EDE3"/><text x="80" y="82" class="s e">AGENT FIELD NOTE / INTERVIEW ROADMAP</text><text x="80" y="145" class="s t">从“看懂代码”到“能用证据回答面试”</text><text x="80" y="190" class="s st">每个阶段都必须留下一个可检查的产物。</text>
  <line x1="210" y1="455" x2="1390" y2="455" stroke="#B66932" stroke-width="6" marker-end="url(#a)"/>
  <g class="s">
    <g transform="translate(95 300)"><circle cx="145" cy="155" r="92" fill="#243236"/><text x="145" y="142" text-anchor="middle" class="n" fill="#E9BE91">01</text><text x="145" y="180" text-anchor="middle" class="h" fill="#fff">读懂</text><rect x="10" y="275" width="270" height="120" rx="16" fill="#fff" stroke="#CBBDA8" stroke-width="3"/><text x="145" y="320" text-anchor="middle" class="tag" fill="#243236">产物</text><text x="145" y="360" text-anchor="middle" class="b" fill="#667174">一张完整调用链图</text></g>
    <g transform="translate(470 300)"><circle cx="145" cy="155" r="92" fill="#B66932"/><text x="145" y="142" text-anchor="middle" class="n" fill="#FFF0DF">02</text><text x="145" y="180" text-anchor="middle" class="h" fill="#fff">修改</text><rect x="10" y="275" width="270" height="120" rx="16" fill="#fff" stroke="#CBBDA8" stroke-width="3"/><text x="145" y="320" text-anchor="middle" class="tag" fill="#243236">产物</text><text x="145" y="360" text-anchor="middle" class="b" fill="#667174">一次分支或故障改造</text></g>
    <g transform="translate(845 300)"><circle cx="145" cy="155" r="92" fill="#5D9E8D"/><text x="145" y="142" text-anchor="middle" class="n" fill="#E9FFF8">03</text><text x="145" y="180" text-anchor="middle" class="h" fill="#fff">验证</text><rect x="10" y="275" width="270" height="120" rx="16" fill="#fff" stroke="#CBBDA8" stroke-width="3"/><text x="145" y="320" text-anchor="middle" class="tag" fill="#243236">产物</text><text x="145" y="360" text-anchor="middle" class="b" fill="#667174">Trace + Test + Eval</text></g>
    <g transform="translate(1220 300)"><circle cx="145" cy="155" r="92" fill="#785147"/><text x="145" y="142" text-anchor="middle" class="n" fill="#F4D9CF">04</text><text x="145" y="180" text-anchor="middle" class="h" fill="#fff">表达</text><rect x="10" y="275" width="270" height="120" rx="16" fill="#fff" stroke="#CBBDA8" stroke-width="3"/><text x="145" y="320" text-anchor="middle" class="tag" fill="#243236">产物</text><text x="145" y="350" text-anchor="middle" class="b" fill="#667174">简历句 · 架构图</text><text x="145" y="380" text-anchor="middle" class="b" fill="#667174">压力追问答案</text></g>
  </g>
  <rect x="180" y="760" width="1240" height="70" rx="16" fill="#243236"/><text x="800" y="805" text-anchor="middle" class="s b" fill="#fff">面试深度 = 能解释设计 + 能定位源码 + 能制造分支 + 能拿出验证结果</text>
</svg>
