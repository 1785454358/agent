<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">一次研究请求的完整执行闭环</title>
  <desc id="desc">ResearchInput 经策略路由进入 Shared Agent Loop，通过模型、工具、证据和执行策略生成 AgentOutcome。</desc>
  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#B66932"/></marker>
    <marker id="g" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#5D9E8D"/></marker>
    <style>.s{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}.e{font-size:21px;font-weight:700;letter-spacing:4px;fill:#9A6A39}.t{font-size:45px;font-weight:800;fill:#243236}.st{font-size:23px;fill:#667174}.h{font-size:22px;font-weight:800}.b{font-size:19px}.small{font-size:17px;fill:#667174}</style>
  </defs>
  <rect width="1600" height="900" fill="#F2EDE3"/>
  <text x="80" y="82" class="s e">AGENT FIELD NOTE / RUNTIME LOOP</text>
  <text x="80" y="145" class="s t">一次研究请求，如何持续向证据收敛</text>
  <text x="80" y="190" class="s st">策略负责组织任务，Shared Agent Loop 负责每个研究分支的模型—工具循环。</text>

  <rect x="80" y="275" width="220" height="130" rx="18" fill="#fff" stroke="#CBBDA8" stroke-width="3"/>
  <text x="190" y="326" text-anchor="middle" class="s h" fill="#243236">ResearchInput</text><text x="190" y="362" text-anchor="middle" class="s b" fill="#667174">问题 · 约束 · 预算</text>
  <path d="M300 340 H385" stroke="#B66932" stroke-width="5" marker-end="url(#a)"/>

  <rect x="395" y="255" width="280" height="170" rx="18" fill="#365055"/>
  <text x="535" y="310" text-anchor="middle" class="s h" fill="#fff">Session Graph</text><text x="535" y="350" text-anchor="middle" class="s b" fill="#E8EEEE">Context · Memory</text><text x="535" y="382" text-anchor="middle" class="s b" fill="#E8EEEE">Strategy Routing</text>
  <path d="M675 340 H760" stroke="#B66932" stroke-width="5" marker-end="url(#a)"/>

  <rect x="770" y="230" width="750" height="400" rx="24" fill="#fff" stroke="#243236" stroke-width="4"/>
  <text x="815" y="280" class="s e">SHARED AGENT LOOP</text>
  <g class="s">
    <rect x="820" y="325" width="210" height="90" rx="14" fill="#243236"/><text x="925" y="380" text-anchor="middle" class="h" fill="#fff">prepare_context</text>
    <rect x="1090" y="325" width="190" height="90" rx="14" fill="#B66932"/><text x="1185" y="380" text-anchor="middle" class="h" fill="#fff">ModelGateway</text>
    <rect x="1335" y="325" width="145" height="90" rx="14" fill="#785147"/><text x="1407" y="362" text-anchor="middle" class="h" fill="#fff">decision</text><text x="1407" y="390" text-anchor="middle" class="small" fill="#F4E5DE">tools?</text>
    <rect x="1090" y="495" width="190" height="90" rx="14" fill="#B66932"/><text x="1185" y="550" text-anchor="middle" class="h" fill="#fff">ToolGateway</text>
    <rect x="820" y="495" width="210" height="90" rx="14" fill="#5D9E8D"/><text x="925" y="550" text-anchor="middle" class="h" fill="#fff">observe · policy</text>
  </g>
  <path d="M1030 370 H1080" stroke="#B66932" stroke-width="4" marker-end="url(#a)"/><path d="M1280 370 H1325" stroke="#B66932" stroke-width="4" marker-end="url(#a)"/><path d="M1407 415 V470 H1285" fill="none" stroke="#B66932" stroke-width="4" marker-end="url(#a)"/><text x="1425" y="455" class="s small">yes</text>
  <path d="M1090 540 H1040" stroke="#5D9E8D" stroke-width="4" marker-end="url(#g)"/><text x="1065" y="520" text-anchor="middle" class="s small">Evidence</text>
  <path d="M820 540 H790 V370 H810" fill="none" stroke="#5D9E8D" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#g)"/><text x="785" y="465" text-anchor="end" class="s small">continue</text>
  <path d="M1407 415 V675 H1320" fill="none" stroke="#785147" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/><text x="1435" y="650" class="s small">no calls / stop</text>

  <rect x="1060" y="675" width="260" height="120" rx="18" fill="#243236"/>
  <text x="1190" y="725" text-anchor="middle" class="s h" fill="#fff">AgentOutcome</text><text x="1190" y="760" text-anchor="middle" class="s b" fill="#E8EEEE">状态 · 证据 · 错误 · 预算</text>
  <path d="M1407 675 H1330" stroke="#785147" stroke-width="4" marker-end="url(#a)"/>

  <text x="80" y="820" class="s st">执行完成不是“模型停止说话”，而是运行时根据计划、证据、预算和错误状态生成明确 Outcome。</text>
</svg>
