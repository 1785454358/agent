<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">State、Evidence、Ledger 与 Memory 的数据边界</title><desc id="desc">四类持久化数据分别保存控制状态、网页证据、工具执行结果和跨会话事实，Runtime Context 保持在进程内。</desc>
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#B66932"/></marker><style>.s{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}.e{font-size:21px;font-weight:700;letter-spacing:4px;fill:#9A6A39}.t{font-size:45px;font-weight:800;fill:#243236}.st{font-size:23px;fill:#667174}.h{font-size:28px;font-weight:800}.b{font-size:20px}.sm{font-size:18px}</style></defs>
  <rect width="1600" height="900" fill="#F2EDE3"/><text x="80" y="82" class="s e">AGENT FIELD NOTE / DATA OWNERSHIP</text><text x="80" y="145" class="s t">可恢复状态、证据、执行记录和记忆，不能混成一份数据</text><text x="80" y="190" class="s st">先划定所有权，才能独立演进、恢复和审计。</text>
  <g class="s" transform="translate(95 270)">
    <g><rect width="320" height="300" rx="22" fill="#243236"/><text x="28" y="58" class="h" fill="#fff">State / Checkpoint</text><text x="28" y="108" class="b" fill="#E8EEEE"><tspan x="28">控制状态 · messages</tspan><tspan x="28" dy="38">todos · Evidence IDs</tspan><tspan x="28" dy="38">Outcome · 恢复位置</tspan></text><text x="28" y="255" class="sm" fill="#E9BE91">可序列化、可恢复</text></g>
    <g transform="translate(365 0)"><rect width="320" height="300" rx="22" fill="#5D9E8D"/><text x="28" y="58" class="h" fill="#fff">Evidence Store</text><text x="28" y="108" class="b" fill="#F0FAF7"><tspan x="28">网页正文 · 来源元数据</tspan><tspan x="28" dy="38">内容哈希 · 生命周期</tspan><tspan x="28" dy="38">引用所需原始证据</tspan></text><text x="28" y="255" class="sm" fill="#E9FFF8">State 只保存 ID</text></g>
    <g transform="translate(730 0)"><rect width="320" height="300" rx="22" fill="#B66932"/><text x="28" y="58" class="h" fill="#fff">Execution Ledger</text><text x="28" y="108" class="b" fill="#FFF3E8"><tspan x="28">稳定 call identity</tspan><tspan x="28" dy="38">已提交结果 · 使用量</tspan><tspan x="28" dy="38">重放与对账依据</tspan></text><text x="28" y="255" class="sm" fill="#FFF0DF">避免重复执行已知结果</text></g>
    <g transform="translate(1095 0)"><rect width="320" height="300" rx="22" fill="#785147"/><text x="28" y="58" class="h" fill="#fff">Memory Store</text><text x="28" y="108" class="b" fill="#F7EBE7"><tspan x="28">跨会话事实 · 偏好</tspan><tspan x="28" dy="38">来源 · 置信度 · 有效期</tspan><tspan x="28" dy="38">权威记录与语义索引</tspan></text><text x="28" y="255" class="sm" fill="#F4D9CF">召回后回查权威 Store</text></g>
  </g>
  <path d="M255 600 V675 H760" fill="none" stroke="#B66932" stroke-width="4" stroke-dasharray="11 9" marker-end="url(#a)"/><path d="M1255 600 V675 H840" fill="none" stroke="#B66932" stroke-width="4" stroke-dasharray="11 9" marker-end="url(#a)"/>
  <rect x="510" y="650" width="580" height="135" rx="20" fill="#fff" stroke="#CBBDA8" stroke-width="3"/><text x="800" y="700" text-anchor="middle" class="s h" fill="#243236">Runtime Context</text><text x="800" y="740" text-anchor="middle" class="s b" fill="#667174">model · tools · clock · database connections</text><text x="800" y="770" text-anchor="middle" class="s sm" fill="#785147">进程资源，不写入 Checkpoint</text>
  <text x="95" y="845" class="s st">判断标准：数据是否需要恢复、是否需要全文保存、是否代表已执行事实、是否跨会话复用。</text>
</svg>
