<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">三类失败与重试所有权</title><desc id="desc">Transport retry、Semantic repair 与 Recovery replay 分别由 Gateway、Agent Loop 和 Checkpoint Worker Ledger 负责。</desc>
  <defs><style>.s{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}.e{font-size:21px;font-weight:700;letter-spacing:4px;fill:#9A6A39}.t{font-size:45px;font-weight:800;fill:#243236}.st{font-size:23px;fill:#667174}.h{font-size:30px;font-weight:800}.owner{font-size:23px;font-weight:700}.b{font-size:20px}.sm{font-size:18px}</style></defs>
  <rect width="1600" height="900" fill="#F2EDE3"/><text x="80" y="82" class="s e">AGENT FIELD NOTE / FAILURE OWNERSHIP</text><text x="80" y="145" class="s t">“重试”不是一个机制，而是三种不同责任</text><text x="80" y="190" class="s st">先判断失败发生在哪一层，再由唯一的主要所有者处理。</text>
  <g class="s" transform="translate(80 275)">
    <g><rect width="450" height="390" rx="22" fill="#fff" stroke="#B66932" stroke-width="4"/><rect width="450" height="20" rx="10" fill="#B66932"/><text x="34" y="78" class="h" fill="#243236">Transport Retry</text><text x="34" y="120" class="owner" fill="#B66932">Owner · ModelGateway / ToolGateway</text><text x="34" y="175" class="b" fill="#3F4B4D"><tspan x="34">超时、连接失败、限流、</tspan><tspan x="34" dy="36">可识别的临时服务错误</tspan></text><line x1="34" y1="250" x2="416" y2="250" stroke="#D8CCBA"/><text x="34" y="292" class="sm" fill="#667174">有限次数 · 指数退避 · 稳定错误分类</text><text x="34" y="330" class="sm" fill="#785147">不负责修改查询语义或工具参数</text></g>
    <g transform="translate(495 0)"><rect width="450" height="390" rx="22" fill="#fff" stroke="#5D9E8D" stroke-width="4"/><rect width="450" height="20" rx="10" fill="#5D9E8D"/><text x="34" y="78" class="h" fill="#243236">Semantic Repair</text><text x="34" y="120" class="owner" fill="#487C70">Owner · Shared Agent Loop</text><text x="34" y="175" class="b" fill="#3F4B4D"><tspan x="34">查询无结果、参数非法、</tspan><tspan x="34" dy="36">证据冲突或来源不够</tspan></text><line x1="34" y1="250" x2="416" y2="250" stroke="#D8CCBA"/><text x="34" y="292" class="sm" fill="#667174">失败作为 ToolMessage 回灌模型</text><text x="34" y="330" class="sm" fill="#785147">不盲目重复已提交的外部副作用</text></g>
    <g transform="translate(990 0)"><rect width="450" height="390" rx="22" fill="#fff" stroke="#785147" stroke-width="4"/><rect width="450" height="20" rx="10" fill="#785147"/><text x="34" y="78" class="h" fill="#243236">Recovery Replay</text><text x="34" y="120" class="owner" fill="#785147">Owner · Checkpoint / Worker / Ledger</text><text x="34" y="175" class="b" fill="#3F4B4D"><tspan x="34">进程崩溃、节点重放、</tspan><tspan x="34" dy="36">at-least-once 重复投递</tspan></text><line x1="34" y1="250" x2="416" y2="250" stroke="#D8CCBA"/><text x="34" y="292" class="sm" fill="#667174">恢复 State，优先读取已提交结果</text><text x="34" y="330" class="sm" fill="#785147">不把业务失败伪装成成功</text></g>
  </g>
  <rect x="190" y="730" width="1220" height="88" rx="18" fill="#243236"/><text x="800" y="785" text-anchor="middle" class="s owner" fill="#fff">同一失败只能有一个主要重试所有者；外部副作用先核对，再决定重放。</text>
</svg>
