<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1150" viewBox="0 0 1200 1150" role="img" aria-labelledby="title desc">
<title id="title">DeepResearch：从研究问题到有来源的回答</title>
<desc id="desc">研究问题进入会话管理并选择策略。程序按计划批量检索、去重、抓取和阅读原文；模型集中整理发现。核对证据后按缺口有限补查，或生成带引用的回答。右侧为贯穿运行的记忆、证据、共享预算、Checkpoint和Ledger。</desc>
<defs>
<marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#4364d8"/></marker>
<marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#138777"/></marker>
<style>
text { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
.heading { font-size:38px; font-weight:700; fill:#172c48; }
.lead { font-size:20px; fill:#526681; }
.section { font-size:25px; font-weight:650; fill:#172c48; }
.node-title { font-size:22px; font-weight:650; fill:#172c48; }
.copy { font-size:18px; fill:#526681; }
.small { font-size:17px; fill:#526681; }
.code { font-family:"Segoe UI",Arial,sans-serif; font-size:17px; fill:#526681; }
.flow { fill:none; stroke:#4364d8; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
.loop { fill:none; stroke:#138777; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
.support { fill:none; stroke:#a0afc6; stroke-width:2; stroke-dasharray:5 6; }
</style></defs>
