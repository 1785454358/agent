<text x="40" y="53" class="copy" style="font-size:17px;fill:#4364d8;font-weight:700;letter-spacing:1.5px">DEEPRESEARCH / ARCHITECTURE</text>
<text x="40" y="99" class="heading">三种研究策略，一个共享运行时</text>
<text x="40" y="130" class="lead">从问题拆解、联网研究，到证据评估与回答生成</text>
