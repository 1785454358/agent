<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DeepResearch Agent Harness architecture</title>
  <desc id="desc">A LangGraph session graph routes three orchestration strategies into one shared agent loop surrounded by context, memory, gateway, budget, checkpoint, evidence, and ledger governance.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071522"/>
      <stop offset="1" stop-color="#10283a"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d3445"/>
      <stop offset="1" stop-color="#0b2738"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020a10" flood-opacity=".4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58d5c8"/>
    </marker>
    <style>
      .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #f4f8fb; }
      .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #9bb2c2; }
      .label { font: 700 13px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 2px; fill: #58d5c8; }
      .box-title { font: 650 19px Inter, Segoe UI, Arial, sans-serif; fill: #eef6fa; }
      .box-copy { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: #9bb2c2; }
      .step { font: 600 15px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #d8e7ef; }
      .small { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #85a2b3; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#background)"/>
  <circle cx="1450" cy="80" r="240" fill="#18a999" opacity=".05"/>
  <circle cx="90" cy="820" r="260" fill="#1c78a8" opacity=".06"/>

  <text x="72" y="72" class="title">DeepResearch Agent Harness</text>
  <text x="72" y="104" class="subtitle">Three orchestration strategies. One governed runtime.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="142" width="1456" height="164" rx="20" fill="#0b2130" stroke="#244457"/>
    <text x="104" y="179" class="label">LANGGRAPH SESSION GRAPH</text>
    <text x="104" y="208" class="box-copy">conversation lifecycle · memory recall / write · strategy routing</text>

    <g>
      <rect x="104" y="232" width="416" height="50" rx="12" fill="#102e40" stroke="#2d5368"/>
      <text x="126" y="263" class="box-title">Workflow</text>
      <text x="472" y="263" class="small" text-anchor="end">fixed parallel flow</text>
    </g>
    <g>
      <rect x="592" y="232" width="416" height="50" rx="12" fill="#123849" stroke="#58d5c8"/>
      <text x="614" y="263" class="box-title">Plan-and-Execute</text>
      <text x="980" y="263" class="small" text-anchor="end">bounded replanning</text>
    </g>
    <g>
      <rect x="1080" y="232" width="416" height="50" rx="12" fill="#102e40" stroke="#2d5368"/>
      <text x="1102" y="263" class="box-title">Multi-Agent</text>
      <text x="1468" y="263" class="small" text-anchor="end">supervised parallelism</text>
    </g>
  </g>

  <path d="M800 306 L800 350" stroke="#58d5c8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="388" y="356" width="824" height="454" rx="24" fill="url(#loop)" stroke="#3d7182" stroke-width="1.5"/>
    <text x="428" y="400" class="label">SHARED AGENT LOOP</text>
    <text x="428" y="433" class="box-title">A single execution contract for every strategy</text>

    <g>
      <rect x="448" y="470" width="304" height="54" rx="12" fill="#112d3e" stroke="#315469"/>
      <text x="600" y="503" class="step" text-anchor="middle">prepare_context</text>

      <path d="M752 497 L844 497" stroke="#58d5c8" stroke-width="2.5" marker-end="url(#arrow)"/>

      <rect x="856" y="470" width="296" height="54" rx="12" fill="#14394a" stroke="#58d5c8"/>
      <text x="1004" y="503" class="step" text-anchor="middle">ModelGateway</text>

      <path d="M1004 524 L1004 565" stroke="#58d5c8" stroke-width="2.5" marker-end="url(#arrow)"/>
      <rect x="856" y="578" width="296" height="54" rx="12" fill="#112d3e" stroke="#315469"/>
      <text x="1004" y="611" class="step" text-anchor="middle">tool_calls ?</text>

      <path d="M856 605 L752 605" stroke="#58d5c8" stroke-width="2.5" marker-end="url(#arrow)"/>
      <rect x="448" y="578" width="304" height="54" rx="12" fill="#14394a" stroke="#58d5c8"/>
      <text x="600" y="611" class="step" text-anchor="middle">ToolGateway</text>

      <path d="M600 632 L600 674" stroke="#58d5c8" stroke-width="2.5" marker-end="url(#arrow)"/>
      <rect x="448" y="687" width="304" height="54" rx="12" fill="#112d3e" stroke="#315469"/>
      <text x="600" y="720" class="step" text-anchor="middle">observe</text>

      <path d="M752 714 L844 714" stroke="#58d5c8" stroke-width="2.5" marker-end="url(#arrow)"/>
      <rect x="856" y="687" width="296" height="54" rx="12" fill="#112d3e" stroke="#315469"/>
      <text x="1004" y="720" class="step" text-anchor="middle">execution policy</text>

      <path d="M1152 605 C1186 605 1187 657 1152 657" fill="none" stroke="#7f9caf" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="1185" y="636" class="small">finish</text>

      <path d="M1004 741 C1004 782 404 787 404 497 C404 470 424 461 448 472" fill="none" stroke="#58d5c8" stroke-width="2.5" marker-end="url(#arrow)"/>
      <text x="799" y="786" class="small" text-anchor="middle">continue with updated state</text>
    </g>
  </g>

  <g>
    <rect x="72" y="374" width="268" height="76" rx="14" fill="#0d2635" stroke="#29495c"/>
    <text x="96" y="405" class="box-title">Context Policy</text>
    <text x="96" y="430" class="box-copy">task · constraints · history</text>

    <rect x="72" y="466" width="268" height="76" rx="14" fill="#0d2635" stroke="#29495c"/>
    <text x="96" y="497" class="box-title">Memory Lifecycle</text>
    <text x="96" y="522" class="box-copy">recall · write · retention</text>

    <rect x="72" y="558" width="268" height="76" rx="14" fill="#0d2635" stroke="#29495c"/>
    <text x="96" y="589" class="box-title">Token Budget</text>
    <text x="96" y="614" class="box-copy">limits · reservations · usage</text>

    <rect x="72" y="650" width="268" height="76" rx="14" fill="#0d2635" stroke="#29495c"/>
    <text x="96" y="681" class="box-title">Checkpoint</text>
    <text x="96" y="706" class="box-copy">durable state · recovery</text>
  </g>

  <g>
    <rect x="1260" y="374" width="268" height="76" rx="14" fill="#0d2635" stroke="#29495c"/>
    <text x="1284" y="405" class="box-title">Model Gateway</text>
    <text x="1284" y="430" class="box-copy">envelope · transport retry</text>

    <rect x="1260" y="466" width="268" height="76" rx="14" fill="#0d2635" stroke="#29495c"/>
    <text x="1284" y="497" class="box-title">Tool Gateway</text>
    <text x="1284" y="522" class="box-copy">policy · parallel calls · retry</text>

    <rect x="1260" y="558" width="268" height="76" rx="14" fill="#0d2635" stroke="#29495c"/>
    <text x="1284" y="589" class="box-title">Evidence Store</text>
    <text x="1284" y="614" class="box-copy">content · provenance · citation</text>

    <rect x="1260" y="650" width="268" height="76" rx="14" fill="#0d2635" stroke="#29495c"/>
    <text x="1284" y="681" class="box-title">Execution Ledger</text>
    <text x="1284" y="706" class="box-copy">idempotency · effects · cost</text>
  </g>

  <g stroke="#315469" stroke-width="1.5" stroke-dasharray="5 6">
    <path d="M340 412 L388 412"/>
    <path d="M340 504 L388 504"/>
    <path d="M340 596 L388 596"/>
    <path d="M340 688 L388 688"/>
    <path d="M1212 412 L1260 412"/>
    <path d="M1212 504 L1260 504"/>
    <path d="M1212 596 L1260 596"/>
    <path d="M1212 688 L1260 688"/>
  </g>

  <text x="72" y="862" class="small">Every exit produces an explicit AgentOutcome · Checkpoint recovery preserves the same runtime invariants</text>
  <text x="1528" y="862" class="small" text-anchor="end">github.com/1785454358/agent</text>
</svg>
