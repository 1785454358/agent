<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResearchPilot · 自主深度研究</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #11161f;
    --panel-2: #161c27;
    --line: #232b38;
    --line-strong: #374150;
    --text: #e8edf4;
    --muted: #8b96a6;
    --faint: #5c6575;
    --amber: #e8b04b;
    --amber-dim: #9a7b3a;
    --ok: #5fc98f;
    --err: #e06767;
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Code", Consolas, monospace;
    --serif: "Source Han Serif SC", "Noto Serif SC", Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.7;
    min-height: 100vh;
  }
  ::selection { background: rgba(232, 176, 75, .28); }

  .shell { max-width: 1080px; margin: 0 auto; padding: 0 28px 96px; }

  /* ---------- 顶部控制条 ---------- */
  .topbar {
    display: flex; align-items: center; gap: 20px;
    padding: 28px 0 22px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 36px;
    flex-wrap: wrap;
  }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand h1 {
    font-family: var(--serif);
    font-size: 26px; font-weight: 600;
    letter-spacing: .02em;
    margin: 0; color: var(--text);
  }
  .brand h1 em { font-style: normal; color: var(--amber); }
  .brand .tagline {
    font-family: var(--mono); font-size: 11px;
    color: var(--faint); letter-spacing: .18em; text-transform: uppercase;
  }
  .search { display: flex; gap: 12px; flex: 1; min-width: 320px; }
  .search input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line-strong);
    color: var(--text);
    padding: 13px 16px;
    border-radius: 4px;
    font-size: 15px;
    font-family: var(--sans);
    outline: none;
    transition: border-color .18s ease;
  }
  .search input::placeholder { color: var(--faint); }
  .search input:focus { border-color: var(--amber-dim); }
  .search select {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line-strong); border-radius: 4px;
    padding: 8px; font-family: var(--sans);
  }
  .search button {
    background: var(--amber);
    color: #141008;
    border: 0; border-radius: 4px;
    padding: 0 24px;
    font-size: 15px; font-weight: 600;
    font-family: var(--sans);
    cursor: pointer;
    white-space: nowrap;
    transition: background .18s ease;
  }
  .search button:hover { background: #f0c36d; }
  .search button:disabled {
    background: var(--line-strong); color: var(--faint); cursor: not-allowed;
  }

  /* ---------- 状态行 ---------- */
  .statusline {
    display: flex; align-items: baseline; gap: 18px;
    font-family: var(--mono); font-size: 13px;
    color: var(--muted);
    margin-bottom: 18px;
    min-height: 20px;
    flex-wrap: wrap;
  }
  .statusline .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--faint); flex: none;
  }
  .statusline.running .dot { background: var(--amber); animation: pulse 1.1s ease-in-out infinite; }
  .statusline.completed .dot, .statusline.partial .dot { background: var(--ok); animation: none; }
  .statusline.failed .dot, .statusline.cancelled .dot { background: var(--err); animation: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .statusline .runid { color: var(--faint); }
  .statusline .count { color: var(--amber); }

  /* ---------- 事件流（时间刻度轨） ---------- */
  .events-block { margin-bottom: 48px; }
  .block-label {
    font-family: var(--mono); font-size: 11px;
    color: var(--faint); letter-spacing: .2em; text-transform: uppercase;
    margin-bottom: 14px;
  }
  .timeline { border-left: 1px solid var(--line); padding-left: 22px; margin-left: 4px; }
  .timeline:empty::after { content: "（等待运行）"; color: var(--faint); font-size: 13px; }
  .event {
    position: relative;
    padding: 7px 0;
    font-size: 14px;
    color: var(--muted);
  }
  .event::before {
    content: "";
    position: absolute; left: -27px; top: 16px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--panel-2);
    border: 1px solid var(--line-strong);
  }
  .event .ts {
    font-family: var(--mono); font-size: 12px;
    color: var(--faint); margin-right: 12px;
  }
  .event .etype {
    font-family: var(--mono); font-size: 11.5px;
    color: var(--amber-dim); margin-right: 12px;
  }
  .event.major { color: var(--text); }
  .event.major::before { background: var(--amber); border-color: var(--amber); }
  .event.final { color: var(--amber); font-weight: 600; }
  .event.final::before { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 10px rgba(232,176,75,.5); }

  /* ---------- 报告 ---------- */
  .report-block { margin-top: 8px; }
  .report {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 44px 52px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 16px;
    line-height: 1.85;
    color: #dbe2ec;
    min-height: 120px;
  }
  .report:empty::before { content: "（报告生成后将在此展示）"; color: var(--faint); }

  @media (max-width: 720px) {
    .shell { padding: 0 18px 72px; }
    .topbar { gap: 14px; padding: 20px 0 16px; }
    .report { padding: 26px 22px; font-size: 15px; }
    .search { min-width: 0; }
    .search { flex-wrap: wrap; }
    .search input { min-width: 180px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="brand">
      <h1>Research<em>Pilot</em></h1>
      <div class="tagline">Plan · Research · Refine</div>
    </div>
    <div class="search">
      <select id="mode" aria-label="研究模式">
        <option value="basic">Basic · 快速研究</option>
        <option value="deep">Deep · 自主深度研究</option>
        <option value="multi_agent">Multi-Agent · 协作研究</option>
      </select>
      <input id="q" placeholder="输入研究问题，例如：2026 年量子计算领域有哪些最新进展？" autocomplete="off">
      <button id="btn" onclick="start()">开始研究</button>
    </div>
  </header>

  <div class="statusline" id="statusline">
    <span class="dot"></span>
    <span id="status">就绪</span>
  </div>

  <section class="events-block">
    <div class="block-label">研究事件</div>
    <div class="timeline" id="events"></div>
  </section>

  <section class="report-block">
    <div class="block-label">最终报告</div>
    <div class="report" id="report"></div>
  </section>

</div>

<script>
let runId = null;
let es = null;
let pollTimer = null;

const $ = (id) => document.getElementById(id);

const MAJOR = new Set(['planning.started', 'planning.completed', 'replanning.started', 'replanning.completed', 'plan.finish_rejected', 'task.started', 'supervisor.dispatched', 'supervisor.retry', 'supervisor.fallback', 'supervisor.reviewed', 'researcher.queued', 'researcher.started', 'researcher.completed', 'tool.batch_limited', 'research.completed', 'writing.completed']);
const FINAL = new Set(['run.completed']);

async function start() {
  const question = $('q').value.trim();
  if (!question) { $('q').focus(); return; }

  $('btn').disabled = true;
  $('events').innerHTML = '';
  $('report').textContent = '';
  setStatus('running', '正在创建运行…');

  try {
    const resp = await fetch('/researches', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question, mode: $('mode').value})
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    runId = (await resp.json()).id;
    setStatus('running', '运行中', runId);
    listen();
    poll();
  } catch (err) {
    setStatus('failed', '创建运行失败：' + err.message);
    $('btn').disabled = false;
  }
}

function setStatus(state, text, id) {
  const line = $('statusline');
  line.className = 'statusline' + (state ? ' ' + state : '');
  let html = text;
  if (id) html += ' <span class="runid">' + id + '</span>';
  $('status').innerHTML = html;
}

function listen() {
  if (es) es.close();
  es = new EventSource('/researches/' + runId + '/events');
  es.onmessage = (e) => {
    const item = JSON.parse(e.data);
    const div = $('events');
    const cls = ['event'];
    if (MAJOR.has(item.event_type)) cls.push('major');
    if (FINAL.has(item.event_type)) cls.push('final');
    const ts = (item.ts || '').slice(11, 19);
    const el = document.createElement('div');
    el.className = cls.join(' ');
    el.innerHTML =
      '<span class="ts">' + ts + '</span>' +
      '<span class="etype">' + escapeHtml(item.event_type) + '</span>' +
      escapeHtml(item.message);
    div.appendChild(el);
    div.scrollIntoView({block: 'nearest'});
  };
  es.addEventListener('done', () => es.close());
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function poll() {
  if (!runId) return;
  try {
    const resp = await fetch('/researches/' + runId);
    const data = await resp.json();
    if (['completed', 'partial', 'failed', 'cancelled'].includes(data.status)) {
      const n = (data.sources || []).length;
      setStatus(data.status, '状态：' + data.status + '；报告来源 <span class="count">' + n + '</span> 个', runId);
      $('report').textContent = data.answer || data.error || '（无结果）';
      $('btn').disabled = false;
      return;
    }
  } catch (err) { /* 短暂网络抖动，继续轮询 */ }
  pollTimer = setTimeout(poll, 2000);
}
</script>
</body>
</html>
