[project]
name = "deeptrace-stage-01-cli-agent"
version = "0.1.0"
description = "Stage 1 reference implementation for a real web research CLI agent"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13",
    "httpx>=0.28.1",
    "json-repair>=0.50",
    "langchain-openai>=1.0.1",
    "langgraph>=1.0",
    "openai>=3.6.0",
    "playwright>=1.55",
    "pydantic>=2.10",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=5.0",
    "tavily-python>=0.8.0",
    "tiktoken>=0.11",
    "tld>=0.13",
    "trafilatura>=2.2.0",
]

[project.scripts]
deeptrace = "deeptrace.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deeptrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "real: 使用真实 API Key 和外部服务的端到端测试",
]
