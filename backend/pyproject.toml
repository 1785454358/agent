[project]
name = "deepresearch"
version = "0.2.0"
description = "LangGraph Agent Harness with Workflow, Plan-and-Execute, and Multi-Agent research strategies"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "json-repair>=0.50",
    "langchain-openai>=1.0.1",
    "langgraph>=1.0",
    "openai>=3.6.0",
    "playwright>=1.55",
    "pydantic>=2.10",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=5.0",
    "tavily-python>=0.8.0",
    "tiktoken>=0.11",
    "tld>=0.13",
    "trafilatura>=2.2.0",
    "aiosqlite>=0.20",
    "torch==2.5.1+cu121",
    "uvicorn[standard]>=0.52.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncmy>=0.2",
    "alembic>=1.13",
    "redis>=5.0",
    "chromadb>=1.5.9,<2",
]

# torch 走 PyTorch 官方 CUDA 索引（PyPI 的 Windows wheel 是 CPU-only 版本）；
# cu121（CUDA 12.1）与本机驱动 536.40（CUDA 12.2）严格匹配。explicit = true
# 表示该索引只服务于 torch。
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[project.scripts]
deepresearch = "deeptrace.cli:main"
deeptrace = "deeptrace.cli:main"

[dependency-groups]
dev = [
    "fakeredis>=2.26",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deeptrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "real: 使用真实 API Key 和外部服务的端到端测试",
]
