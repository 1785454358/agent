name: LangSmith evaluation

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [workflow, plan_execute, multi_agent]
        default: workflow
      max_examples:
        type: number
        default: 1
      repetitions:
        type: number
        default: 1

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: 'true'
      LANGSMITH_PROJECT: deeptrace
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      DEEPTRACE_MEMORY_RETRIEVAL: lexical
      EVAL_MODE: ${{ inputs.mode }}
      EVAL_MAX_EXAMPLES: ${{ inputs.max_examples }}
      EVAL_REPETITIONS: ${{ inputs.repetitions }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - run: uv run --no-sync playwright install --with-deps chromium
      - run: uv run --no-sync python -m deeptrace.evaluation sync-dataset
      - run: >-
          uv run --no-sync python -m deeptrace.evaluation run
          --mode "$EVAL_MODE" --max-examples "$EVAL_MAX_EXAMPLES"
          --repetitions "$EVAL_REPETITIONS" --judge --require-acceptance
