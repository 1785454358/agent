name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Test locked isolated scorer with networking disabled
        uses: docker/build-push-action@v6
        with:
          context: backend/evaluation
          file: backend/evaluation/Dockerfile
          push: false
          tags: deepresearch:scorer-test
          cache-from: type=gha,scope=scorer
          cache-to: type=gha,scope=scorer,mode=max

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Showcase build
        run: npm run build:showcase

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Run deterministic tests inside the packaged image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: test
          push: false
          tags: deepresearch:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: deepresearch:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify browser and dashboard as the release user
        run: >-
          docker run --rm --network none
          --mount "type=bind,source=${{ github.workspace }}/backend/tests/deployment/smoke_image.py,target=/tmp/smoke_image.py,readonly"
          deepresearch:ci python /tmp/smoke_image.py
